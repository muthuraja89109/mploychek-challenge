<header class="bar">
  <div class="bar-inner">
    <a class="brand" routerLink="/dashboard" aria-label="MPloyChek verification desk">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M9 16.5l5 5 9-10" fill="none" stroke="var(--verified)" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>MPloyChek</span>
    </a>

    <nav aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">Manage users</a>
      }
    </nav>

    <div class="tools">
      <button class="icon-btn" type="button" (click)="theme.toggle()"
              [attr.aria-label]="theme.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'">
        @if (theme.theme() === 'light') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        }
      </button>

      @if (auth.user(); as user) {
        <div class="who">
          <span class="who-name">{{ user.name }}</span>
          <app-role-badge [role]="user.role" />
        </div>
      }
      <button class="btn btn-quiet btn-small" type="button" (click)="auth.logout()">Sign out</button>
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
